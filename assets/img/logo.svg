<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Martinez Junk Removal">
  <title>Martinez Junk Removal</title>
  <rect width="512" height="512" fill="#10161C"/>

  <!-- Load-line mark -->
  <g>
    <rect x="96" y="96" width="120" height="46" fill="#FFAD1F" opacity=".42"/>
    <rect x="96" y="163" width="216" height="46" fill="#FFAD1F" opacity=".72"/>
    <rect x="96" y="230" width="312" height="46" fill="#FFAD1F"/>
  </g>

  <!-- Wordmark. Live text, so it needs Archivo installed to render exactly as
       the site header does; see README — export this to outlines or a 512px PNG
       before launch if you care about pixel fidelity in search results. -->
  <text x="96" y="366" fill="#FFFFFF"
        font-family="Archivo, 'Arial Narrow', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800" letter-spacing="-1.5">MARTINEZ</text>
  <text x="98" y="410" fill="#8C9AA6"
        font-family="'IBM Plex Mono', ui-monospace, monospace"
        font-size="31" font-weight="600" letter-spacing="6.2">JUNK REMOVAL</text>

  <!-- Hi-vis rule, echoing the tick divider used between page sections -->
  <rect x="96" y="440" width="312" height="4" fill="#FFAD1F"/>
</svg>
